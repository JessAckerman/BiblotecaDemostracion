<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital</title>

    <!-- Archivo CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <h1>Biblioteca Digital</h1>
        <p>Gestiona el catálogo de libros de manera sencilla.</p>
    </header>

    <main>

        <!-- Formulario para registrar libros -->
        <section id="registro">
            <h2>Registrar nuevo libro</h2>

            <form id="formLibro">

                <div>
                    <label for="titulo">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ingrese el título del libro"
                        required>
                </div>

                <div>
                    <label for="autor">Autor</label>
                    <input
                        type="text"
                        id="autor"
                        name="autor"
                        placeholder="Ingrese el autor"
                        required>
                </div>

                <div>
                    <label for="categoria">Categoría</label>
                    <input
                        type="text"
                        id="categoria"
                        name="categoria"
                        placeholder="Ingrese la categoría"
                        required>
                </div>

                <button type="submit">
                    Agregar libro
                </button>

            </form>
        </section>

        <!-- Barra de búsqueda -->
        <section id="buscador">
            <h2>Buscar libros</h2>

            <input
                type="text"
                id="busqueda"
                name="busqueda"
                placeholder="Buscar por título o autor"
                aria-label="Buscar libro por título o autor">
        </section>

        <!-- Filtro de disponibilidad -->
        <section id="filtros">

            <label for="filtroDisponibilidad">
                Disponibilidad
            </label>

            <select
                id="filtroDisponibilidad"
                name="filtroDisponibilidad">

                <option value="todos">Todos</option>
                <option value="disponible">Disponibles</option>
                <option value="prestado">Prestados</option>

            </select>

        </section>

        <!-- Catálogo de libros -->
        <section id="catalogo">

            <h2>Catálogo de Libros</h2>

            <div id="listaLibros">
                <!-- Los libros se mostrarán aquí mediante JavaScript -->
            </div>

        </section>

    </main>

    <!-- Archivo JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
